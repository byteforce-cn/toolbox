<!doctype html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Byteforce Toolbox</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 20% 20%, #1a1a2e 0%, #16213e 45%, #0f3460 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .title {
            font-size: 28px;
            font-weight: 650;
            letter-spacing: 0.5px;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hint {
            font-size: 13px;
            opacity: 0.85;
        }

        .progress {
            width: 100%;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .progress > div {
            height: 100%;
            width: 40%;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.95);
            animation: loading 1.2s infinite ease-in-out;
        }

        @keyframes loading {
            0% {
                transform: translateX(-120%);
            }

            100% {
                transform: translateX(300%);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">Byteforce Toolbox</div>
        <div class="content">
            <div id="splash-message" class="hint">正在初始化...</div>
            <div class="progress">
                <div></div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var closed = false;

            function closeSplash() {
                if (closed) return;
                closed = true;
                try {
                    window.__TAURI__.core.invoke('close_splashscreen').catch(function () { });
                } catch (_) { }
            }

            function bootstrap() {
                if (!window.__TAURI__ || !window.__TAURI__.core) {
                    // IPC bridge not injected yet — retry shortly
                    setTimeout(bootstrap, 50);
                    return;
                }

                window.__TAURI__.core.invoke('init').catch(function (err) {
                    console.warn('splash: init failed', err);
                });

                window.__TAURI__.event.listen('splash_message', function (evt) {
                    var el = document.getElementById('splash-message');
                    if (el && evt.payload) el.textContent = evt.payload.message || '';
                });

                window.__TAURI__.event.listen('backend_ready', function () {
                    var el = document.getElementById('splash-message');
                    if (el) el.textContent = '加载界面中...';
                });
            }

            bootstrap();

            // Ultimate failsafe: self-close after 20s no matter what
            setTimeout(closeSplash, 20000);
        })();
    </script>
</body>

</html>
